<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVIS Camera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell camera-page">
    <header class="camera-header">
      <a class="logo logo-medium" href="index.html"><span>JO</span><span class="gradient-text">VIS</span></a>
      <h1>Camera inteligente</h1>
    </header>

    <main>
      <section class="camera-preview">
        <div class="scan-pill">Leitura visual ativa</div>
        <span class="grid-line v one"></span><span class="grid-line v two"></span>
        <span class="grid-line h one"></span><span class="grid-line h two"></span>
        <div class="scan-target">
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
          <div class="focus-icon"><span></span><span></span><span></span><span></span></div>
          <p>Aponte para<br>rotulos, objetos<br>ou alimentos</p>
        </div>
      </section>

      <section class="capture-controls">
        <button class="capture-side" aria-label="Galeria">&#9639;</button>
        <a class="shutter" href="nutritional-result.html" aria-label="Capturar"></a>
        <button class="capture-side" aria-label="Modo camera">&#8981;</button>
      </section>
    </main>

    <nav class="bottom-navigation">
      <a href="index.html"><span>&#9670;</span>Inicio</a>
      <a class="active" href="camera-scan.html"><span>&#8981;</span>Camera</a>
      <a href="nutritional-result.html"><span>&#9635;</span>Resultado</a>
      <a href="create-post.html"><span>&#9813;</span>Post</a>
      <a href="communities.html"><span>&#9827;</span>Comunidades</a>
      <a href="gallery.html"><span>&#9639;</span>Galeria</a>
    </nav>
  </div>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOVIS Camera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell camera-page">
    <header class="camera-header">
      <a class="logo logo-medium" href="index.html"><span>JO</span><span class="gradient-text">VIS</span></a>
      <h1>Câmera Inteligente</h1>
    </header>

    <main>
      <section class="camera-preview">
        <div class="scan-pill">Leitura visual ativa</div>
        <div class="scan-sweep" aria-hidden="true"></div>
        <span class="grid-line v one"></span><span class="grid-line v two"></span>
        <span class="grid-line h one"></span><span class="grid-line h two"></span>
        <div class="scan-target">
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
          <div class="focus-icon"><span></span><span></span><span></span><span></span></div>
        </div>
        <p class="scan-instruction">Aponte para rótulos, objetos ou alimentos</p>
      </section>

      <section class="capture-controls">
        <button class="capture-side" aria-label="Galeria"><img class="icon" src="src/icons/photo_library.svg" alt="" aria-hidden="true"></button>
        <a class="shutter" href="nutritional-result.html" aria-label="Capturar"></a>
        <button class="capture-side" aria-label="Modo camera"><img class="icon" src="src/icons/photo_camera.svg" alt="" aria-hidden="true"></button>
      </section>

      <a class="camera-result-card" href="nutritional-result.html">
        <img src="src/images/acai-toppings.jpg" alt="Acai com toppings">
        <div>
          <span><img class="icon icon-small ai-icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true"> Última análise</span>
          <strong>Açaí com granola</strong>
          <small>Ver review, clareza e detalhes da IA</small>
        </div>
        <img class="icon" src="src/icons/analytics.svg" alt="" aria-hidden="true">
      </a>
    </main>

    <nav class="bottom-navigation">
      <a href="index.html"><img class="icon" src="src/icons/home.svg" alt="" aria-hidden="true">Início</a>
      <a class="active" href="camera-scan.html"><img class="icon" src="src/icons/photo_camera.svg" alt="" aria-hidden="true">Câmera</a>
      <a href="create-post.html"><img class="icon" src="src/icons/add.svg" alt="" aria-hidden="true">Post</a>
      <a href="communities.html"><img class="icon" src="src/icons/groups.svg" alt="" aria-hidden="true">Comunidades</a>
      <a href="gallery.html"><img class="icon" src="src/icons/photo_library.svg" alt="" aria-hidden="true">Galeria</a>
      <a href="profile.html"><span class="nav-avatar">JV</span>Perfil</a>
    </nav>
  </div>
  <script>
    const preview = document.querySelector(".camera-preview");
    const sweep = document.querySelector(".scan-sweep");

    if (preview && sweep && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      let direction = 1;
      let position = 28;

      function animateScan() {
        const limit = preview.clientHeight - sweep.offsetHeight - 28;
        position += direction * 1.8;

        if (position >= limit || position <= 28) {
          direction *= -1;
          position = Math.max(28, Math.min(position, limit));
        }

        sweep.style.transform = `translateY(${position}px)`;
        requestAnimationFrame(animateScan);
      }

      requestAnimationFrame(animateScan);
    }
  </script>
</body>
</html>

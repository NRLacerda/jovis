  <div class="profile-modal" data-gallery-modal hidden>
    <div class="profile-modal-card" role="dialog" aria-modal="true" aria-labelledby="gallery-modal-title">
      <button class="modal-close" type="button" data-close-gallery-modal aria-label="Fechar"><img class="icon" src="src/icons/close.svg" alt="" aria-hidden="true"></button>
      <img class="modal-image" data-gallery-modal-image src="src/images/acai.webp" alt="">
      <h2 id="gallery-modal-title"><img class="icon ai-icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true"><span data-gallery-modal-title>Review da IA</span></h2>
      <p data-gallery-modal-detail>Analise gerada pela IA.</p>
    </div>

  <script>
    const galleryModal = document.querySelector("[data-gallery-modal]");
    const galleryModalImage = document.querySelector("[data-gallery-modal-image]");
    const galleryModalTitle = document.querySelector("[data-gallery-modal-title]");
    const galleryModalDetail = document.querySelector("[data-gallery-modal-detail]");

    const galleryReviews = {
      acai: "Alimento roxo intenso, provavelmente acai. A IA destacaria textura cremosa, potencial energia rapida e necessidade de verificar toppings ou acucares adicionados.",
      aperol: "Bebida alaranjada em copo, com perfil visual de drink. A IA marcaria cor vibrante, apresentacao social e recomendaria consumo responsavel.",
      cacau: "Imagem associada a cacau. A IA buscaria casca, polpa ou graos e classificaria como ingrediente natural com contexto culinario.",
      cosmopolitan: "Drink de cor rosada, visual limpo e urbano. A IA indicaria bebida preparada, possivel coquetel e boa captura para catalogar ocasioes.",
      "costela de adao": "Planta ornamental de folhas recortadas. A IA sugeriria luz indireta, limpeza das folhas e atencao a pets.",
      cupuacu: "Fruta amazonica de polpa clara e aroma marcante. A IA classificaria como alimento regional e bom item para receitas ou comparacao nutricional.",
      feijoada: "Prato brasileiro com feijao escuro e acompanhamentos. A IA destacaria refeicao densa, sabor marcante e porcao a observar.",
      gato: "Animal domestico em cena. A IA focaria em identificacao geral, expressao e contexto, evitando conclusoes de saude sem dados.",
      jambo: "Fruta de casca avermelhada. A IA apontaria alimento fresco, textura brilhante e uso em catalogo de compras ou curiosidades.",
      lirio: "Flor ornamental delicada. A IA sugeriria identificacao botanica, cuidado com luz e alerta de toxicidade para pets em alguns lirios.",
      lotus: "Flor aquatica ou ornamental. A IA destacaria simetria, valor decorativo e contexto natural.",
      macarrao: "Prato de massa. A IA classificaria como refeicao, observaria molho e porcao, e sugeriria comparar ingredientes se houver embalagem."
    };

    function normalizeTitle(title) {
      return title.toLowerCase().replace(" repetido", "").replace(" repetida", "").replace(/-/g, " ");
    }

    function reviewFor(title) {
      const key = normalizeTitle(title);
      return galleryReviews[key] || `${title}: a IA identificaria elementos principais, cores, textura e contexto de uso para salvar uma descricao mais util da captura.`;
    }

    function closeGalleryModal() {
      galleryModal.hidden = true;
      document.body.classList.remove("modal-open");
    }

    document.querySelectorAll(".gallery-ai").forEach((button) => {
      button.addEventListener("click", () => {
        const image = button.closest(".gallery-item").querySelector("img");
        galleryModalImage.src = image.src;
        galleryModalImage.alt = image.alt;
        galleryModalTitle.textContent = image.alt;
        galleryModalDetail.textContent = reviewFor(image.alt);
        galleryModal.hidden = false;
        document.body.classList.add("modal-open");
      });
    });

    document.querySelector("[data-close-gallery-modal]").addEventListener("click", closeGalleryModal);
    galleryModal.addEventListener("click", (event) => {
      if (event.target === galleryModal) closeGalleryModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !galleryModal.hidden) closeGalleryModal();
    });
  </script>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil JOVIS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell profile-page">
    <header class="profile-header">
      <a class="logo logo-small" href="index.html"><span>JO</span><span class="gradient-text">VIS</span></a>
      <button class="round-button" type="button" data-open-achievement="Explorador visual" aria-label="Abrir destaque do perfil">
        <img class="icon" src="src/icons/notifications.svg" alt="" aria-hidden="true">
      </button>
    </header>

    <main class="profile-content">
      <section class="profile-hero reveal-on-load">
        <img class="profile-avatar" src="src/images/profile-pic.jpeg" alt="Foto de perfil Jovis Explorer">
        <div class="profile-copy">
          <p class="eyebrow">Perfil público</p>
          <h1>Jovis Explorer</h1>
          <p>Capturas do cotidiano, comparações úteis e descobertas feitas com a câmera.</p>
        </div>
      </section>

      <section class="profile-stats reveal-on-load" aria-label="Estatisticas do perfil">
        <article>
          <strong data-count-to="142">0</strong>
          <span>Scans</span>
        </article>
        <article>
          <strong data-count-to="38">0</strong>
          <span>Salvos</span>
        </article>
        <article>
          <strong data-count-to="12">0</strong>
          <span>Posts</span>
        </article>
      </section>

      <section class="profile-achievements reveal-on-load">
        <h2 class="section-title">Conquistas</h2>
        <div class="achievement-row">
          <button type="button" data-open-achievement="Explorador visual" data-detail="Você completou 100 scans e desbloqueou resumos mais detalhados.">
            <span><img class="icon" src="src/icons/photo_camera.svg" alt="" aria-hidden="true"></span>
            <strong>Explorador visual</strong>
            <small>100+ scans</small>
          </button>
          <button type="button" data-open-achievement="Comparador esperto" data-detail="Você salvou comparações de rótulos, produtos e imagens para revisar depois.">
            <span><img class="icon" src="src/icons/analytics.svg" alt="" aria-hidden="true"></span>
            <strong>Comparador esperto</strong>
            <small>38 salvos</small>
          </button>
          <button type="button" data-open-achievement="Comunidade ativa" data-detail="Você compartilhou descobertas e recebeu respostas da comunidade.">
            <span><img class="icon" src="src/icons/groups.svg" alt="" aria-hidden="true"></span>
            <strong>Comunidade ativa</strong>
            <small>12 posts</small>
          </button>
        </div>
      </section>

      <section class="profile-gallery reveal-on-load">
        <div class="profile-section-head">
          <h2 class="section-title">Capturas</h2>
          <a href="gallery.html">Ver galeria</a>
        </div>
        <div class="profile-image-grid" aria-label="Capturas do perfil">
          <button type="button" data-preview="src/images/acai-toppings.jpg" data-title="Acai com toppings"><img src="src/images/acai-toppings.jpg" alt="Acai com toppings"><span class="ai-review-chip"><img class="icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true">AI review</span></button>
          <button type="button" data-preview="src/images/camera-vision.jpeg" data-title="Leitura pela camera"><img src="src/images/camera-vision.jpeg" alt="Leitura pela camera"><span class="ai-review-chip"><img class="icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true">AI review</span></button>
          <button type="button" data-preview="src/images/cacau.jpg" data-title="Cacau"><img src="src/images/cacau.jpg" alt="Cacau"><span class="ai-review-chip"><img class="icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true">AI review</span></button>
          <button type="button" data-preview="src/images/feijoada.webp" data-title="Feijoada"><img src="src/images/feijoada.webp" alt="Feijoada"><span class="ai-review-chip"><img class="icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true">AI review</span></button>
          <button type="button" data-preview="src/images/lirio.jpg" data-title="Lirio"><img src="src/images/lirio.jpg" alt="Lirio"><span class="ai-review-chip"><img class="icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true">AI review</span></button>
          <button type="button" data-preview="src/images/macarrao.webp" data-title="Macarrao"><img src="src/images/macarrao.webp" alt="Macarrao"><span class="ai-review-chip"><img class="icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true">AI review</span></button>
        </div>
      </section>
    </main>

    <div class="profile-modal" data-profile-modal hidden>
      <div class="profile-modal-card" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
        <button class="modal-close" type="button" data-close-modal aria-label="Fechar"><img class="icon" src="src/icons/close.svg" alt="" aria-hidden="true"></button>
        <img class="modal-image" data-modal-image src="src/images/acai-toppings.jpg" alt="">
        <h2 id="profile-modal-title"><img class="icon ai-icon" src="src/icons/ai-icon.png" alt="" aria-hidden="true"><span data-modal-title>Captura</span></h2>
        <p data-modal-detail>Detalhes da captura selecionada.</p>
      </div>
    </div>

    <nav class="bottom-navigation">
      <a href="index.html"><img class="icon" src="src/icons/home.svg" alt="" aria-hidden="true">Início</a>
      <a href="camera-scan.html"><img class="icon" src="src/icons/photo_camera.svg" alt="" aria-hidden="true">Câmera</a>
      <a href="create-post.html"><img class="icon" src="src/icons/add.svg" alt="" aria-hidden="true">Post</a>
      <a href="communities.html"><img class="icon" src="src/icons/groups.svg" alt="" aria-hidden="true">Comunidades</a>
      <a href="gallery.html"><img class="icon" src="src/icons/photo_library.svg" alt="" aria-hidden="true">Galeria</a>
      <a class="active" href="profile.html"><span class="nav-avatar">JV</span>Perfil</a>
    </nav>
  </div>

  <script>
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const modal = document.querySelector("[data-profile-modal]");
    const modalImage = document.querySelector("[data-modal-image]");
    const modalTitle = document.querySelector("[data-modal-title]");
    const modalDetail = document.querySelector("[data-modal-detail]");

    document.querySelectorAll("[data-count-to]").forEach((stat) => {
      const target = Number(stat.dataset.countTo);

      if (reduceMotion) {
        stat.textContent = target;
        return;
      }

      let frame = 0;
      const totalFrames = 42;
      const tick = () => {
        frame += 1;
        const progress = 1 - Math.pow(1 - frame / totalFrames, 3);
        stat.textContent = Math.round(target * progress);
        if (frame < totalFrames) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });

    function openModal({ title, detail, image }) {
      modalTitle.textContent = title;
      modalDetail.textContent = detail;
      modalImage.hidden = !image;
      if (image) {
        modalImage.src = image;
        modalImage.alt = title;
      }
      modal.hidden = false;
      document.body.classList.add("modal-open");
    }

    function generatedReview(title) {
      const reviews = {
        "Acai com toppings": "A IA identifica uma tigela de açaí com granola e frutas. Características: cores roxas intensas, textura cremosa e toppings crocantes. Bom para revisar ingredientes e comparar quantidade de açúcar.",
        "Leitura pela camera": "A IA detecta uma cena de camera ativa, com foco em leitura visual. Características: ambiente escuro, área central de escaneamento e boa composição para demonstrar a função principal.",
        "Cacau": "A IA classifica como cacau ou ingrediente natural. Características: tons terrosos, origem alimentar e bom item para catalogar receitas, produtos ou curiosidades.",
        "Feijoada": "A IA identifica um prato de feijoada. Características: refeição brasileira densa, alto contraste entre feijão e acompanhamentos, ideal para registro de comida e porção.",
        "Lirio": "A IA identifica uma flor do tipo lirio. Características: petalas delicadas, valor ornamental e possível alerta de cuidado se houver animais em casa.",
        "Macarrao": "A IA identifica uma refeição de massa. Características: prato principal, textura de macarrão visível e bom candidato para comparar molho, porção e ingredientes."
      };
      return reviews[title] || `${title}: a IA revisaria objeto principal, cores, textura e contexto para transformar a captura em uma descrição mais útil.`;
    }

    function closeModal() {
      modal.hidden = true;
      document.body.classList.remove("modal-open");
    }

    document.querySelectorAll("[data-open-achievement]").forEach((button) => {
      button.addEventListener("click", () => {
        openModal({
          title: button.dataset.openAchievement,
          detail: button.dataset.detail || "Perfil em destaque por consistência nas capturas.",
          image: ""
        });
      });
    });

    document.querySelectorAll("[data-preview]").forEach((button) => {
      button.addEventListener("click", () => {
        openModal({
          title: button.dataset.title,
          detail: generatedReview(button.dataset.title),
          image: button.dataset.preview
        });
      });
    });

    document.querySelector("[data-close-modal]").addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !modal.hidden) closeModal();
    });
  </script>
</body>
</html>
